<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>좋은데이 판촉 보고서</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; padding-bottom: 120px; color: #334155; }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .brand-title { font-weight: 800; font-size: 16px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #f8fafc; }
        .input-row { display: flex; align-items: center; margin-bottom: 8px; }
        .label-text { width: 110px; font-size: 14px; color: #475569; font-weight: 600; }
        .input-box { flex: 1; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; text-align: right; font-size: 14px; outline: none; }
        .input-box:focus { border-color: #3b82f6; background-color: #f8fafc; }
        .unit { margin-left: 6px; font-size: 13px; color: #94a3b8; width: 15px; }
        .add-btn { background-color: #1e293b; color: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md mx-auto">
        <div class="card">
            <div class="input-row">
                <span class="label-text">총 방문업소:</span>
                <input type="number" id="visitCount" class="input-box" placeholder="0">
                <span class="unit">개</span>
            </div>
            <div class="input-row mb-0">
                <span class="label-text">상권 선택:</span>
                <input type="text" id="marketName" class="input-box text-left" placeholder="상권명 입력">
                <span class="unit"></span>
            </div>
        </div>

        <div class="card">
            <div class="brand-title text-blue-600">가. 무학</div>
            <div class="input-row"><span class="label-text">좋은데이:</span><input type="number" id="t_good" class="input-box" value="0"><span class="unit">t</span></div>
            <div class="input-row"><span class="label-text">부산갈매기:</span><input type="number" id="t_seagull" class="input-box border-blue-200" value="0"><span class="unit">t</span></div>
            <div class="input-row"><span class="label-text">톡시리즈:</span><input type="number" id="t_tok" class="input-box" value="0"><span class="unit">t</span></div>
            <div class="input-row mb-0"><span class="label-text">기타:</span><input type="number" id="t_muhak_etc" class="input-box" value="0"><span class="unit">t</span></div>
        </div>

        <div class="card">
            <div class="brand-title text-red-500">나. 하이트진로</div>
            <div class="input-row"><span class="label-text">참이슬:</span><input type="number" id="t_isul" class="input-box" value="0"><span class="unit">t</span></div>
            <div class="input-row"><span class="label-text">진로:</span><input type="number" id="t_jinro" class="input-box" value="0"><span class="unit">t</span></div>
            <div class="input-row mb-0"><span class="label-text">기타:</span><input type="number" id="t_hite_etc" class="input-box" value="0"><span class="unit">t</span></div>
        </div>

        <div class="card">
            <div class="brand-title text-emerald-600">다. 대선주조</div>
            <div class="input-row"><span class="label-text">대선(C1포함):</span><input type="number" id="t_daesun" class="input-box" value="0"><span class="unit">t</span></div>
            <div class="input-row"><span class="label-text">부산:</span><input type="number" id="t_busan" class="input-box" value="0"><span class="unit">t</span></div>
            <div class="input-row mb-0"><span class="label-text">기타:</span><input type="number" id="t_ds_etc" class="input-box" value="0"><span class="unit">t</span></div>
        </div>

        <div class="card">
            <div class="brand-title text-orange-500">라. 롯데</div>
            <div class="input-row"><span class="label-text">새로(살구포함):</span><input type="number" id="t_saero" class="input-box" value="0"><span class="unit">t</span></div>
            <div class="input-row"><span class="label-text">청하(별빛포함):</span><input type="number" id="t_chungha" class="input-box" value="0"><span class="unit">t</span></div>
            <div class="input-row mb-0"><span class="label-text">기타:</span><input type="number" id="t_lotte_etc" class="input-box" value="0"><span class="unit">t</span></div>
        </div>

        <div class="card">
            <div class="brand-title text-slate-500">마. 기타 주류회사</div>
            <div class="input-row mb-0"><span class="label-text">합계:</span><input type="number" id="t_etc_total" class="input-box" value="0"><span class="unit">t</span></div>
        </div>

        <div class="card">
            <div class="flex justify-between items-center mb-4 text-blue-600 font-bold italic">
                <span>2. 전환 및 추가주문</span>
                <button onclick="addRow()" class="add-btn">인원 추가 +</button>
            </div>
            <div class="grid grid-cols-10 gap-1 text-[10px] font-bold text-center text-gray-400 mb-2 italic">
                <div class="col-span-3 text-left pl-1 text-gray-700">이름</div>
                <div class="col-span-2">좋은데이</div>
                <div class="col-span-2">부산갈매기</div>
                <div class="col-span-2">톡톡</div>
                <div class="col-span-1"></div>
            </div>
            <div id="userList" class="space-y-2"></div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-md border-t z-50">
        <button onclick="copyReport()" class="w-full max-w-md mx-auto block bg-blue-600 text-white py-4 rounded-xl font-black shadow-lg active:scale-95 transition-all">
            보고서 계산 및 복사하기
        </button>
    </div>

    <script>
        let uIdx = 0;
        function addRow() {
            uIdx++;
            const div = document.createElement('div');
            div.id = `u_${uIdx}`;
            div.className = "grid grid-cols-10 gap-1 items-center pb-2 border-b border-gray-50 last:border-0";
            div.innerHTML = `
                <div class="col-span-3"><input type="text" placeholder="이름" class="u-name input-box text-left bg-blue-50 border-none font-bold p-2 w-full"></div>
                <div class="col-span-2"><input type="number" placeholder="0" class="u-v1 input-box p-2 w-full"></div>
                <div class="col-span-2"><input type="number" placeholder="0" class="u-v2 input-box p-2 w-full border-blue-200"></div>
                <div class="col-span-2"><input type="number" placeholder="0" class="u-v3 input-box p-2 w-full"></div>
                <div class="col-span-1 text-right"><button onclick="document.getElementById('u_${uIdx}').remove()" class="text-red-400 font-bold">✕</button></div>
            `;
            document.getElementById('userList').appendChild(div);
        }
        // 초기 인원 2명 생성
        addRow(); addRow();

        function getV(id) { return Number(document.getElementById(id)?.value) || 0; }
        function getP(v, t) { return t === 0 ? "0.0" : ((v/t)*100).toFixed(1); }

        function copyReport() {
            const date = new Date().toLocaleDateString('ko-KR', {month:'long', day:'numeric', weekday:'short'});
            const market = document.getElementById('marketName').value || "상권미정";
            const visit = getV('visitCount');
            
            const mu1=getV('t_good'), mu2=getV('t_seagull'), mu3=getV('t_tok'), mu4=getV('t_muhak_etc');
            const muhakT = mu1 + mu2 + mu3 + mu4;
            const hiteT = getV('t_isul') + getV('t_jinro') + getV('t_hite_etc');
            const dsT = getV('t_daesun') + getV('t_busan') + getV('t_ds_etc');
            const lotteT = getV('t_saero') + getV('t_chungha') + getV('t_lotte_etc');
            const etcT = getV('t_etc_total');
            const totalT = muhakT + hiteT + dsT + lotteT + etcT;

            let s1=0, s2=0, s3=0, details="";
            document.querySelectorAll('#userList > div').forEach(r => {
                const n = r.querySelector('.u-name').value || "익명";
                const v1 = Number(r.querySelector('.u-v1').value) || 0;
                const v2 = Number(r.querySelector('.u-v2').value) || 0;
                const v3 = Number(r.querySelector('.u-v3').value) || 0;
                s1+=v1; s2+=v2; s3+=v3;
                details += `${n}: ${v1}t / ${v2}t / ${v3}t\n`;
            });

            const reportText = `< ${date} ${market} 상권 보고 >

1. 점유비
- 총 방문업소: ${visit}개
- 총 테이블 수: ${totalT}T

가. 무학: ${muhakT}T (${getP(muhakT, totalT)}%)
- 좋은데이: ${mu1}T / 갈매기: ${mu2}T / 톡톡: ${mu3}T / 기타: ${mu4}T

나. 하이트진로: ${hiteT}T (${getP(hiteT, totalT)}%)
- 참이슬: ${getV('t_isul')}T / 진로: ${getV('t_jinro')}T / 기타: ${getV('t_hite_etc')}T

다. 대선주조: ${dsT}T (${getP(dsT, totalT)}%)
- 대선(C1): ${getV('t_daesun')}T / 부산: ${getV('t_busan')}T / 기타: ${getV('t_ds_etc')}T

라. 롯데: ${lotteT}T (${getP(lotteT, totalT)}%)
- 새로: ${getV('t_saero')}T / 청하: ${getV('t_chungha')}T / 기타: ${getV('t_lotte_etc')}T

마. 기타 주류회사: ${etcT}T (${getP(etcT, totalT)}%)

2. 근무자 판촉 실정
- 총 전환: ${s1}t(좋은데이) / ${s2}t(부산갈매기) / ${s3}t(톡톡)
${details}
3. 특이사항
- 없음`;

            navigator.clipboard.writeText(reportText).then(() => alert("✅ 보고서 복사 완료!"));
        }
    </script>
</body>
</html>
