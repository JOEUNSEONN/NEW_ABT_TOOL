<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>좋은데이 판촉 보고서</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .input-box { border: 1px solid #e2e8f0; border-radius: 6px; padding: 6px; text-align: center; width: 100%; font-size: 13px; }
        .card { background: white; border-radius: 12px; padding: 15px; shadow: sm; }
        .grid-header { font-size: 11px; color: #64748b; text-align: center; font-weight: bold; }
    </style>
</head>
<body class="pb-32 px-4 pt-4">

    <div class="max-w-md mx-auto space-y-6">
        <div class="card space-y-2">
            <input type="text" id="reportDate" class="input-box bg-gray-50 border-none font-bold" placeholder="📅 00월 00일(목)">
            <input type="text" id="marketName" class="input-box bg-gray-50 border-none font-bold" placeholder="📍 상권명 입력">
        </div>

        <div class="card space-y-4">
            <h2 class="font-bold text-blue-600 border-b pb-2 italic">1. 점유비 입력 (T)</h2>
            <div class="grid grid-cols-2 gap-3">
                <div><label class="text-[10px] ml-1">좋은데이</label><input type="number" id="t_good" class="input-box"></div>
                <div><label class="text-[10px] ml-1">부산갈매기</label><input type="number" id="t_seagull" class="input-box border-blue-300"></div>
                <div><label class="text-[10px] ml-1">톡시리즈</label><input type="number" id="t_tok" class="input-box"></div>
                <div><label class="text-[10px] ml-1">기타(무학)</label><input type="number" id="t_muhak_etc" class="input-box"></div>
            </div>
            <div class="grid grid-cols-3 gap-2 pt-2 border-t">
                <div><label class="text-[10px] ml-1 text-red-400 font-bold">참이슬</label><input type="number" id="t_isul" class="input-box"></div>
                <div><label class="text-[10px] ml-1 text-red-400 font-bold">진로</label><input type="number" id="t_jinro" class="input-box"></div>
                <div><label class="text-[10px] ml-1 text-green-500 font-bold">대선/부산</label><input type="number" id="t_daesun" class="input-box"></div>
                <div><label class="text-[10px] ml-1 text-orange-400 font-bold">새로</label><input type="number" id="t_saero" class="input-box"></div>
                <div><label class="text-[10px] ml-1 text-orange-400 font-bold">청하</label><input type="number" id="t_chungha" class="input-box"></div>
            </div>
        </div>

        <div class="card space-y-4">
            <div class="flex justify-between items-end">
                <h2 class="font-bold text-gray-800 italic">2. 전환 및 추가주문</h2>
                <button onclick="addUserRow()" class="bg-black text-white text-[11px] px-3 py-1.5 rounded-md font-bold transition-all active:scale-95">인원 추가하기</button>
            </div>

            <div class="grid grid-cols-10 gap-1 px-1">
                <div class="col-span-3 grid-header">이름</div>
                <div class="col-span-2 grid-header">좋은데이</div>
                <div class="col-span-2 grid-header">갈매기</div>
                <div class="col-span-2 grid-header">톡톡</div>
                <div class="col-span-1"></div>
            </div>
            
            <div id="userRowContainer" class="space-y-2">
                </div>
        </div>

        <div class="card">
            <h2 class="font-bold text-gray-800 mb-2 italic text-sm">3. 특이사항</h2>
            <textarea id="memo" class="w-full input-box text-left h-20" placeholder="없음"></textarea>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-sm border-t flex gap-2 max-w-md mx-auto z-50">
        <button onclick="copyFullReport()" class="flex-1 bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition-all">
            보고서 복사하기
        </button>
    </div>

    <script>
        let rowIdx = 0;

        function addUserRow() {
            rowIdx++;
            const container = document.getElementById('userRowContainer');
            const row = document.createElement('div');
            row.id = `row_${rowIdx}`;
            row.className = "grid grid-cols-10 gap-1 items-center pb-2 border-b border-gray-50 last:border-0";
            row.innerHTML = `
                <div class="col-span-3"><input type="text" placeholder="이름" class="u-name input-box bg-blue-50 border-none font-bold"></div>
                <div class="col-span-2"><input type="number" placeholder="0" class="u-v1 input-box"></div>
                <div class="col-span-2"><input type="number" placeholder="0" class="u-v2 input-box border-blue-200"></div>
                <div class="col-span-2"><input type="number" placeholder="0" class="u-v3 input-box"></div>
                <div class="col-span-1 text-center"><button onclick="removeRow(${rowIdx})" class="text-red-400 text-xs">✕</button></div>
            `;
            container.appendChild(row);
        }

        function removeRow(id) { document.getElementById(`row_${id}`).remove(); }

        // 기본 2줄 생성
        addUserRow(); addUserRow();

        function getV(id) { return Number(document.getElementById(id)?.value) || 0; }
        function getP(v, total) { return total === 0 ? "0.0" : ((v/total)*100).toFixed(1); }

        function copyFullReport() {
            const date = document.getElementById('reportDate').value || "00월 00일(목)";
            const market = document.getElementById('marketName').value || "000";
            const memo = document.getElementById('memo').value || "없음";
            
            // 1. 점유비 계산
            const mu1 = getV('t_good'), mu2 = getV('t_seagull'), mu3 = getV('t_tok'), mu4 = getV('t_muhak_etc');
            const muhakTotal = mu1 + mu2 + mu3 + mu4;
            const hiteTotal = getV('t_isul') + getV('t_jinro');
            const dsTotal = getV('t_daesun');
            const lotteTotal = getV('t_saero') + getV('t_chungha');
            const grandTotal = muhakTotal + hiteTotal + dsTotal + lotteTotal;

            // 2. 판촉 실정 계산
            let sum1 = 0, sum2 = 0, sum3 = 0;
            let detailList = "";
            const rows = document.querySelectorAll('#userRowContainer > div');
            rows.forEach(r => {
                const name = r.querySelector('.u-name').value || "익명";
                const v1 = Number(r.querySelector('.u-v1').value) || 0;
                const v2 = Number(r.querySelector('.u-v2').value) || 0;
                const v3 = Number(r.querySelector('.u-v3').value) || 0;
                sum1 += v1; sum2 += v2; sum3 += v3;
                detailList += `${name}: ${v1}t / ${v2}t / ${v3}t\n`;
            });

            const finalReport = `< ${date} ${market} 상권 보고 >

1. 점유비
- 총 방문업소: -개
- 총 테이블 수: ${grandTotal}T

가. 무학: ${muhakTotal}T (${getP(muhakTotal, grandTotal)}%)
- 좋은데이: ${mu1}T (${getP(mu1, grandTotal)}%)
- 톡시리즈: ${mu3}T (${getP(mu3, grandTotal)}%)
- 부산갈매기: ${mu2}T (${getP(mu2, grandTotal)}%)
- 기타: ${mu4}T (${getP(mu4, grandTotal)}%)

나. 하이트진로: ${hiteTotal}T (${getP(hiteTotal, grandTotal)}%)
다. 대선주조: ${dsTotal}T (${getP(dsTotal, grandTotal)}%)
라. 롯데: ${lotteTotal}T (${getP(lotteTotal, grandTotal)}%)

2. 근무자 판촉 실정
가. 근무인원

- 총 전환: ${sum1}t(좋은데이) / ${sum2}t(부산갈매기) / ${sum3}t(톡톡)
${detailList}
3. 타사 활동
- 하이트진로: 대판팀 2명 / 행사팀 2명
- 대선주조: 대판팀 2명
- 롯데주류: 없음

4. 특이사항
- ${memo}`;

            navigator.clipboard.writeText(finalReport).then(() => {
                alert("✅ 계산 완료 및 보고서가 복사되었습니다!");
            });
        }
    </script>
</body>
</html>
